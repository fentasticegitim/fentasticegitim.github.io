<!-- components/header.html -->
<header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between relative">
        
        <!-- Sol: Profil / Gece Modu Kısayolu -->
        <button id="theme-toggle" class="p-2 text-slate-500 hover:text-emerald-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>

        <!-- ORTA: Fen Yeşili ve Açık Mavi Gradyan Başlık -->
        <a href="index.html" class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1.5">
            <span class="text-xl font-black font-heading bg-gradient-to-r from-emerald-500 via-teal-400 to-sky-400 bg-clip-text text-transparent tracking-tight">
                Fentastic Eğitim
            </span>
        </a>

        <!-- SAĞ: Üç Çizgi Hamburger Menü Butonu -->
        <button id="menu-btn" onclick="toggleMenu()" aria-label="Menüyü Aç" class="p-2 text-slate-700 dark:text-slate-200 hover:text-emerald-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </div>
</header>
